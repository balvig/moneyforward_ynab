service: mfynab
image: balvig/mfynab

primary_role: cron
servers:
  cron:
    hosts:
      - 5.223.69.58
    proxy: false

registry:
  server: ghcr.io
  username: balvig
  password:
    - GHCR_REGISTRY_PASSWORD
builder:
  arch: amd64

env:
  secret:
    - YNAB_ACCESS_TOKEN
    - COOKIE_CACHE_PRIME

aliases:
  shell: app exec --interactive --reuse "bash"
